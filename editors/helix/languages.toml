# Merge into ~/.config/helix/languages.toml. Needs `t` on $PATH. For syntax
# highlighting, see "Syntax highlighting" in the README.

[language-server.t]
command = "t"
args = ["lsp"]

[[language]]
name = "t"
scope = "source.t"
file-types = ["t"]
# The first is what commenting out a line uses; Enter in a comment continues
# any of them, `///` doc comments included.
comment-tokens = ["//", "///"]
indent = { tab-width = 4, unit = "    " }
language-servers = ["t"]
# Format with `t lsp` (as `t fmt` does) on every save.
auto-format = true

[[grammar]]
name = "t"
source = { git = "https://github.com/lkurcak/t-lang", rev = "main", subpath = "editors/tree-sitter-t" }
