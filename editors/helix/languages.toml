# Merge into ~/.config/helix/languages.toml. Needs `t` on $PATH. For syntax
# highlighting, `t tree-sitter --helix ~/.config/helix/runtime` installs the
# parser and queries of that `t` (see "Syntax highlighting" in the README).
# There's no [[grammar]] entry: `hx --grammar build` would replace that
# parser with one built from the newest grammar, whatever your `t` accepts.

[language-server.t]
command = "t"
args = ["lsp"]

[[language]]
name = "t"
scope = "source.t"
file-types = ["t"]
# The first is what commenting out a line uses; Enter in a comment continues
# any of them, `///` doc comments included.
comment-tokens = ["//", "///"]
indent = { tab-width = 4, unit = "    " }
language-servers = ["t"]
# Format with `t lsp` (as `t fmt` does) on every save.
auto-format = true
