[package]
name = "tree-sitter-t"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Tree-sitter grammar for T, for syntax highlighting"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lkurcak/t-lang"
publish = false
build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.9"

[build-dependencies]
cc = "1.2"
