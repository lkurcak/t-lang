# This lives here rather than in editors/tree-sitter-t, as `tree-sitter init`
# puts it, because `cargo package` leaves out any directory with a
# Cargo.toml: t-lang's crate needs the grammar, to build the parser `t
# tree-sitter` installs.
[package]
name = "tree-sitter-t"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Tree-sitter grammar for T, for syntax highlighting"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lkurcak/t-lang"
publish = false

[lib]
path = "lib.rs"

[dependencies]
tree-sitter-language = "0.1.9"

[build-dependencies]
cc = "1.2"
