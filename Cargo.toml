[package]
name = "t-lang"
version = "0.46.0"
edition = "2024"
rust-version = "1.99"
description = "T: like C, but a different letter. A small no-GC language built one type-theory concept at a time."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lkurcak/t-lang"
readme = "README.md"
keywords = ["language", "compiler", "type-theory", "lsp"]
categories = ["compilers", "command-line-utilities"]

[[bin]]
name = "t"
path = "src/main.rs"

[dependencies]
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde_json = "1.0.154"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[build-dependencies]
cc = "1.8.0"

[dev-dependencies]
tree-sitter = "0.27"
tree-sitter-t = { path = "editors/tree-sitter-t/bindings/rust" }

# The tests check each of about a thousand programs, and the core library
# with it: unoptimised, that's minutes. Overflow checks and debug
# assertions stay on, as in any test build; `cargo build` stays quick.
[profile.test]
opt-level = 1

[lints.clippy]
mod_module_files = "warn"
