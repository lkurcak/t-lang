name: Release

# A step PR carries the version bump; when it lands on main, the shared
# workflow tags it and releases from the tag (forge's rust-release.yml).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: lkurcak/forge/.github/workflows/rust-release.yml@v1
    permissions:
      contents: write
      id-token: write
      actions: write
    secrets: inherit
    with:
      crates-io: true
      binaries: true
      homebrew: true
