name: Sanitizers

# Kept out of ci.yml, which holds the shared rust-ci call alone (forge checks
# this); forge-config lists this file in t-lang's own_workflows. It isn't a
# required check, so `paths-ignore` can skip it on a change to the backlog
# or the notes for agents alone, which no test reads; the shared CI skips
# its checks on the same changes from inside, since `ci / ok` is required.

on:
  pull_request:
    paths-ignore: [BACKLOG.md, "backlog/**", CLAUDE.md, PROJECT.md]
  push:
    branches: [main]
    paths-ignore: [BACKLOG.md, "backlog/**", CLAUDE.md, PROJECT.md]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A newer run of the same ref cancels an older one, as in the shared CI:
# a few pushes in a row would otherwise each run in full.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The C backend's differential tests again, each compiled program built
  # with AddressSanitizer (and LeakSanitizer) and UndefinedBehaviorSanitizer,
  # stopping at the first report: the C it writes must have no undefined
  # behaviour and free all it allocates (docs/33-c-backend.md). Then with
  # ThreadSanitizer.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test compiled --locked
        env:
          T_LANG_CFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all
      # And with ThreadSanitizer, which can't be with AddressSanitizer: a
      # program the checker accepted has no data races (lemma Z2 of
      # docs/41-threads.md), so a report, which changes what it writes
      # where errors go, fails the test. Its shadow memory needs the
      # kernel's address randomisation turned down.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cargo test --test compiled --locked
        env:
          T_LANG_CFLAGS: -fsanitize=thread
