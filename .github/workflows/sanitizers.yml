name: Sanitizers

# Kept out of ci.yml, which holds the shared rust-ci call alone (forge checks
# this); forge-config lists this file in t-lang's own_workflows.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The C backend's differential tests again, each compiled program built
  # with AddressSanitizer (and LeakSanitizer) and UndefinedBehaviorSanitizer,
  # stopping at the first report: the C it writes must have no undefined
  # behaviour and free all it allocates (docs/33-c-backend.md). Then with
  # ThreadSanitizer.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test compiled --locked
        env:
          T_LANG_CFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all
      # And with ThreadSanitizer, which can't be with AddressSanitizer: a
      # program the checker accepted has no data races (lemma Z2 of
      # docs/41-threads.md), so a report, which changes what it writes
      # where errors go, fails the test. Its shadow memory needs the
      # kernel's address randomisation turned down.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cargo test --test compiled --locked
        env:
          T_LANG_CFLAGS: -fsanitize=thread
